name: Feature request
description: Propose a user problem Buildflow should solve.
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who has this problem, and what are they unable to do today?
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: Desired experience
      description: Describe what the user should see and do without implementation details.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This keeps the core experience local first.
          required: true
        - label: This can be used without Git, npm, or terminal knowledge.
          required: true
